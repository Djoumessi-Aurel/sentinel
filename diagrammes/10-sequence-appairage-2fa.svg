675.329,283.266" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="447.872" y1="283.266" x2="677.329" y2="283.266" style="stroke:#1F3A5F;stroke-width:1;"/><text x="454.872" y="263.535" fill="#1F3A5F" font-size="12" textLength="102.047" font-family="Aptos">enregistre le secret</text><text x="560.253" y="263.535" fill="#1F3A5F" font-size="12" textLength="36.674" font-weight="700" font-family="Aptos">chiffré</text><text x="596.927" y="263.535" fill="#1F3A5F" font-size="12" font-family="Aptos">,</text><text x="454.872" y="278.629" fill="#1F3A5F" font-size="12" textLength="68.982" font-family="Aptos">sans l'activer</text><path d="M452.872,298.266 L452.872,349.266 A2,2 0 0 0 454.872,351.266 L696.872,351.266 A2,2 0 0 0 698.872,349.266 L698.872,306.266 L688.872,296.266 L454.872,296.266 A2,2 0 0 0 452.872,298.266" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><path d="M688.872,296.266 L688.872,305.266 A1,1 0 0 0 689.872,306.266 L698.872,306.266 L688.872,296.266" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><text x="458.872" y="313.723" fill="#000" font-size="12" textLength="196.775" font-family="Aptos">Chiffré, et non haché : le serveur doit</text><text x="458.872" y="328.816" fill="#000" font-size="12" textLength="206.771" font-family="Aptos">pouvoir le relire pour recalculer le code</text><text x="458.872" y="343.91" fill="#000" font-size="12" textLength="225" font-family="Aptos">attendu. C'est l'inverse d'un mot de passe.</text><polygon points="267.466,373.641,257.466,377.641,267.466,381.641,263.466,377.641" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.466" y1="377.641" x2="436.872" y2="377.641" style="stroke:#1F3A5F;stroke-width:1;stroke-dasharray:2,2;"/><text x="273.466" y="373.004" fill="#1F3A5F" font-size="12" textLength="157.406" font-family="Aptos">secret, URI otpauth, QR code</text><polygon points="756.42,402.734,766.42,406.734,756.42,410.734,760.42,406.734" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="39.675" y1="406.734" x2="762.42" y2="406.734" style="stroke:#1F3A5F;stroke-width:1;"/><text x="46.675" y="402.098" fill="#1F3A5F" font-size="12" textLength="102.059" font-family="Aptos">scanne le QR code</text><polygon points="50.675,446.922,40.675,450.922,50.675,454.922,46.675,450.922" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="44.675" y1="450.922" x2="767.42" y2="450.922" style="stroke:#1F3A5F;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.675" y="431.191" fill="#1F3A5F" font-size="12" textLength="91.383" font-family="Aptos">code à 6 chiffres,</text><text x="56.675" y="446.285" fill="#1F3A5F" font-size="12" textLength="133.418" font-family="Aptos">renouvelé toutes les 30 s</text><polygon points="244.466,476.016,254.466,480.016,244.466,484.016,248.466,480.016" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="39.675" y1="480.016" x2="250.466" y2="480.016" style="stroke:#1F3A5F;stroke-width:1;"/><text x="46.675" y="475.379" fill="#1F3A5F" font-size="12" textLength="116.713" font-family="Aptos">saisit ce premier code</text><polygon points="425.872,505.109,435.872,509.109,425.872,513.109,429.872,509.109" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.466" y1="509.109" x2="431.872" y2="509.109" style="stroke:#1F3A5F;stroke-width:1;"/><text x="263.466" y="504.473" fill="#1F3A5F" font-size="12" textLength="144.732" font-family="Aptos">POST /api/auth/2fa/confirm</text><polygon points="671.329,534.203,681.329,538.203,671.329,542.203,675.329,538.203" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="447.872" y1="538.203" x2="677.329" y2="538.203" style="stroke:#1F3A5F;stroke-width:1;"/><text x="454.872" y="533.566" fill="#1F3A5F" font-size="12" textLength="120.053" font-family="Aptos">lit et déchiffre le secret</text><line x1="447.872" y1="567.297" x2="489.872" y2="567.297" style="stroke:#1F3A5F;stroke-width:1;"/><line x1="489.872" y1="567.297" x2="489.872" y2="580.297" style="stroke:#1F3A5F;stroke-width:1;"/><line x1="448.872" y1="580.297" x2="489.872" y2="580.297" style="stroke:#1F3A5F;stroke-width:1;"/><polygon points="458.872,576.297,448.872,580.297,458.872,584.297,454.872,580.297" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="454.872" y="562.66" fill="#1F3A5F" font-size="12" textLength="74.039" font-family="Aptos">vérifie le code</text><path d="M25.675,592.297 L82.679,592.297 L82.679,599.391 L72.679,609.391 L23.675,609.391 L23.675,594.297 A2,2 0 0 1 25.675,592.297" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="23.675" y="592.297" width="687.9" height="355.594" fill="none" style="stroke:#000;stroke-width:1.5;" rx="2" ry="2"/><text x="38.675" y="605.754" fill="#000" font-size="12" textLength="14.004" font-weight="700" font-family="Aptos">alt</text><text x="97.679" y="606.754" fill="#000" font-size="12" textLength="82.014" font-weight="700" font-family="Aptos">[Code correct]</text><polygon points="671.329,651.672,681.329,655.672,671.329,659.672,675.329,655.672" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="447.872" y1="655.672" x2="677.329" y2="655.672" style="stroke:#1F3A5F;stroke-width:1;"/><text x="454.872" y="635.941" fill="#1F3A5F" font-size="12" textLength="69.363" font-family="Aptos">active la 2FA</text><text x="454.872" y="651.035" fill="#1F3A5F" font-size="12" textLength="216.457" font-family="Aptos">+ 10 codes de récupération (empreintes)</text><polygon points="267.466,680.766,257.466,684.766,267.466,688.766,263.466,684.766" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.466" y1="684.766" x2="436.872" y2="684.766" style="stroke:#1F3A5F;stroke-width:1;stroke-dasharray:2,2;"/><text x="273.466" y="680.129" fill="#1F3A5F" font-size="12" textLength="70.711" font-family="Aptos">les 10 codes,</text><text x="347.511" y="680.129" fill="#1F3A5F" font-size="12" textLength="42.023" font-weight="700" font-family="Aptos">en clair</text><polygon points="50.675,709.859,40.675,713.859,50.675,717.859,46.675,713.859" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="44.675" y1="713.859" x2="255.466" y2="713.859" style="stroke:#1F3A5F;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.675" y="709.223" fill="#1F3A5F" font-size="12" textLength="118.74" font-family="Aptos">affichés une seule fois</text><path d="M261.466,728.859 L261.466,809.859 A2,2 0 0 0 263.466,811.859 L522.466,811.859 A2,2 0 0 0 524.466,809.859 L524.466,736.859 L514.466,726.859 L263.466,726.859 A2,2 0 0 0 261.466,728.859" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><path d="M514.466,726.859 L514.466,735.859 A1,1 0 0 0 515.466,736.859 L524.466,736.859 L514.466,726.859" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><text x="267.466" y="744.316" fill="#000" font-size="12" textLength="236.174" font-family="Aptos">Ils répondent au téléphone perdu. Sans eux,</text><text x="267.466" y="759.41" fill="#000" font-size="12" textLength="174.398" font-family="Aptos">la seule issue serait d'appeler un</text><text x="267.466" y="774.504" fill="#000" font-size="12" textLength="242.127" font-family="Aptos">administrateur — et si la personne concernée</text><text x="267.466" y="789.598" fill="#000" font-size="12" textLength="203.045" font-family="Aptos">EST le dernier administrateur, il n'y en</text><text x="267.466" y="804.691" fill="#000" font-size="12" textLength="76.055" font-family="Aptos">aurait aucune.</text><line x1="23.675" y1="818.328" x2="711.575" y2="818.328" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="28.675" y="832.785" fill="#000" font-size="12" textLength="92.678" font-weight="700" font-family="Aptos">[Code incorrect]</text><polygon points="267.466,855.516,257.466,859.516,267.466,863.516,263.466,859.516" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.466" y1="859.516" x2="436.872" y2="859.516" style="stroke:#1F3A5F;stroke-width:1;stroke-dasharray:2,2;"/><text x="273.466" y="854.879" fill="#1F3A5F" font-size="12" textLength="116.344" font-family="Aptos">refus, rien n'est activé</text><path d="M452.872,874.516 L452.872,940.516 A2,2 0 0 0 454.872,942.516 L687.872,942.516 A2,2 0 0 0 689.872,940.516 L689.872,882.516 L679.872,872.516 L454.872,872.516 A2,2 0 0 0 452.872,874.516" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><path d="M679.872,872.516 L679.872,881.516 A1,1 0 0 0 680.872,882.516 L689.872,882.516 L679.872,872.516" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><text x="458.872" y="889.973" fill="#000" font-size="12" textLength="216.703" font-family="Aptos">Rien n'est activé tant qu'un premier code</text><text x="458.872" y="905.066" fill="#000" font-size="12" textLength="216.691" font-family="Aptos">n'a pas confirmé l'appairage : un QR mal</text><text x="458.872" y="920.16" fill="#000" font-size="12" textLength="194.391" font-family="Aptos">scanné enfermerait sinon l'utilisateur</text><text x="458.872" y="935.254" fill="#000" font-size="12" textLength="172.113" font-family="Aptos">dehors à sa connexion suivante.</text><?plantuml-src XLJBRXn55DttLroy6HWcjZ4IYooGB8j8aOWWThApXChLjpqbLT-gr6D8TcpPym5iHtm2k_IVv4joRlNOGoS8B8raLP-wZ_EeBvnONtkcNsmOnogdiOw-wuehdkaoHkEIkMS2m1lgGxt3iQbborBSuAmfBaZN6Lj2ejV5UPTDuPh8PAfTDAauwwAHGYVJxpOPkPKNGGYzOk4JHKMKNm9V_HgUjO8td7REph0ocAutnToPp7JoujtDon_RUNztQ7w2OVrXe5lfLvyEsT0cngwhzEJxrfQUqlk_wD8Mj-Fq7_lH-x-xXiSzp85hF_zqyuhEJ7HdYZsx6CnPvbAZpk9sOA3DgzZ7AyKbfYgKsIOkIkZ5EGLRkEG7O7y774lYUvSBq1ZbW5wl