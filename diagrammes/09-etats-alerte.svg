<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:782px;height:482px;background:#FFFFFF;" width="782px" height="482px" viewBox="0 0 782 482" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="306.327" y="24.533" fill="#000" font-size="14" textLength="162.846" font-weight="700" font-family="Aptos">Cycle de vie d'une alerte</text></g><!--cluster Active--><g class="cluster" data-qualified-name="Active" id="ent0001" data-source-line="7"><path d="M342.5,119.609 L424.5,119.609 A2,2 0 0 1 426.5,121.609 L426.5,139.703 L340.5,139.703 L340.5,121.609 A2,2 0 0 1 342.5,119.609" fill="#F4F6FA"/><path d="M340.5,139.703 L426.5,139.703 L426.5,199.609 A2,2 0 0 1 424.5,201.609 L342.5,201.609 A2,2 0 0 1 340.5,199.609 L340.5,139.703" fill="#F4F6FA"/><rect x="340.5" y="119.609" width="86" height="82" fill="none" style="stroke:#1F3A5F;stroke-width:0.5;" rx="2" ry="2"/><line x1="340.5" y1="139.703" x2="426.5" y2="139.703" style="stroke:#1F3A5F;stroke-width:0.5;"/><text x="367.161" y="132.066" fill="#1F3A5F" font-size="12" textLength="32.678" font-family="Aptos">Active</text></g><g class="entity" data-qualified-name="Notifiee" id="ent0002" data-source-line="14"><rect x="155" y="261.609" width="60.688" height="50" fill="#F4F6FA" style="stroke:#1F3A5F;stroke-width:0.5;" rx="2" ry="2"/><line x1="155" y1="286.703" x2="215.688" y2="286.703" style="stroke:#1F3A5F;stroke-width:0.5;"/><text x="165" y="279.066" fill="#1F3A5F" font-size="12" textLength="40.688" font-family="Aptos">Notifiée</text></g><g class="entity" data-qualified-name="EnCooldown" id="ent0003" data-source-line="15"><rect x="6" y="399.109" width="88.713" height="50" fill="#F4F6FA" style="stroke:#1F3A5F;stroke-width:0.5;" rx="2" ry="2"/><line x1="6" y1="424.203" x2="94.713" y2="424.203" style="stroke:#1F3A5F;stroke-width:0.5;"/><text x="16" y="416.566" fill="#1F3A5F" font-size="12" textLength="68.713" font-family="Aptos">En cooldown</text></g><g class="entity" data-qualified-name="Resolue" id="ent0004" data-source-line="18"><rect x="479.5" y="261.609" width="64.027" height="50" fill="#F4F6FA" style="stroke:#1F3A5F;stroke-width:0.5;" rx="2" ry="2"/><line x1="479.5" y1="286.703" x2="543.527" y2="286.703" style="stroke:#1F3A5F;stroke-width:0.5;"/><text x="489.5" y="279.066" fill="#1F3A5F" font-size="12" textLength="44.027" font-family="Aptos">Résolue</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="5"><ellipse cx="402.5" cy="60.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="20"><ellipse cx="511.5" cy="423.109" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="511.5" cy="423.109" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="23"><path d="M273,383.609 L273,420.109 L95.207,424.109 L273,428.109 L273,465.078 A2,2 0 0 0 275,467.078 L480.133,467.078 A2,2 0 0 0 482.133,465.078 L482.133,391.609 L472.133,381.609 L275,381.609 A2,2 0 0 0 273,383.609" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><path d="M472.133,381.609 L472.133,390.609 A1,1 0 0 0 473.133,391.609 L482.133,391.609 L472.133,381.609" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><text x="279" y="399.066" fill="#000" font-size="12" textLength="188.133" font-family="Aptos">Sans cooldown, une application qui</text><text x="279" y="414.16" fill="#000" font-size="12" textLength="166.066" font-family="Aptos">produit mille erreurs par minute</text><text x="279" y="429.254" fill="#000" font-size="12" textLength="168.053" font-family="Aptos">enverrait mille SMS. Le premier</text><text x="279" y="444.348" fill="#000" font-size="12" textLength="184.102" font-family="Aptos">déclenchement alerte, les suivants</text><text x="279" y="459.441" fill="#000" font-size="12" textLength="83.385" font-family="Aptos">sont regroupés.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="31"><path d="M540.5,391.109 L540.5,457.484 A2,2 0 0 0 542.5,459.484 L764.572,459.484 A2,2 0 0 0 766.572,457.484 L766.572,399.109 L756.572,389.109 L621.665,389.109 L536.887,311.834 L613.665,389.109 L542.5,389.109 A2,2 0 0 0 540.5,391.109" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><path d="M756.572,389.109 L756.572,398.109 A1,1 0 0 0 757.572,399.109 L766.572,399.109 L756.572,389.109" style="stroke:#B8860B;stroke-width:0.5;" fill="#FFF8E1"/><text x="546.5" y="406.566" fill="#000" font-size="12" textLength="205.072" font-family="Aptos">Une alerte résolue n'est jamais purgée</text><text x="546.5" y="421.66" fill="#000" font-size="12" textLength="181.74" font-family="Aptos">tant qu'elle est active : la purge de</text><text x="546.5" y="436.754" fill="#000" font-size="12" textLength="184.125" font-family="Aptos">rétention ne touche que les alertes</text><text x="546.5" y="451.848" fill="#000" font-size="12" textLength="74.713" font-family="Aptos">déjà résolues.</text></g><g class="start_entity" data-qualified-name="Active..start.Active" id="ent0007" data-source-line="8"><ellipse cx="366.5" cy="171.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-link-type="dependency"><polygon points="402.5,119.442,406.5,110.442,402.5,114.442,398.5,110.442,402.5,119.442" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M402.5,74.864 C402.5,85.362 402.5,101.834 402.5,118.285 C402.5,118.542 402.5,118.799 402.5,119.056 C402.5,119.185 402.5,114.313 402.5,114.442" style="stroke:#1F3A5F;stroke-width:1;" fill="none"/><text x="404.5" y="107.066" fill="#1F3A5F" font-size="12" textLength="124.09" font-family="Aptos">une règle se déclenche</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="216.331,266.702,226.094,265.407,220.593,264.088,221.912,258.587,216.331,266.702" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M356.25,180.895 C329.702,197.176 262.143,238.607 220.593,264.088" style="stroke:#1F3A5F;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="43.49,398.755,45.542,389.123,42.456,393.864,37.715,390.777,43.49,398.755" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M154.968,287.564 C123.336,289.353 75.269,297.61 51.5,329.609 C36.883,349.287 38.128,373.39 42.456,393.864" style="stroke:#1F3A5F;stroke-width:1;" fill="none"/><text x="54.821" y="344.066" fill="#1F3A5F" font-size="12" textLength="106.072" font-family="Aptos">notification envoyée</text><text x="53.5" y="359.16" fill="#1F3A5F" font-size="12" textLength="108.715" font-family="Aptos">sur les canaux actifs</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="183.421,311.801,178.1,320.089,182.661,316.743,186.008,321.304,183.421,311.801" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M95.229,409.188 C118.637,399.78 145.988,385.09 163.5,363.609 C175.478,348.917 180.175,332.922 182.661,316.743" style="stroke:#1F3A5F;stroke-width:1;" fill="none"/><text x="181.5" y="344.066" fill="#1F3A5F" font-size="12" textLength="124.078" font-family="Aptos">la règle se redéclenche</text><text x="195.176" y="359.16" fill="#1F3A5F" font-size="12" textLength="96.727" font-family="Aptos">après le cooldown</text></g><g class="link" data-entit