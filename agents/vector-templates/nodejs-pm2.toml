# Agent de collecte Vector — type d'application : nodejs-pm2
# Généré depuis agents/vector-templates/nodejs-pm2.toml par agents/install.sh.
#
# Point de vigilance (docs/AGENT_SETUP.md) : PM2 écrit dans le dossier de
# l'utilisateur sous lequel il tourne. Sur le serveur LTM, `api` tourne sous
# root (/root/.pm2/logs) tandis que `updater` et `watcher` tournent sous
# gltmadmin (/home/gltmadmin/.pm2/logs). L'agent doit donc être lancé sous un
# utilisateur ayant accès en lecture à ces dossiers, sinon il ne remontera
# rien — sans erreur visible.

[sources.app_logs]
type = "file"
# Le motif accepte plusieurs fichiers : PM2 numérote les logs par identifiant de
# processus (api-out-0.log, api-out-1.log, ...).
include = ["${LOG_PATH}"]
read_from = "end"
fingerprint.strategy = "device_and_inode"

[transforms.to_payload]
type = "remap"
inputs = ["app_logs"]
source = '''
. = {
  "applicationId": "${APPLICATION_ID}",
  "server": "${SERVER_NAME}",
  "lines": [{ "raw": string!(.message) }]
}
'''

[sinks.backend]
type = "http"
inputs = ["to_payload"]
uri = "${BACKEND_URL}/api/ingestion/logs"
method = "post"
encoding.codec = "json"
batch.max_bytes = 1048576
batch.timeout_secs = 2
request.headers.Authorization = "Bearer ${AGENT_TOKEN}"
request.retry_attempts = 5
buffer.type = "disk"
buffer.max_size = 268435488
buffer.when_full = "drop_newest"
